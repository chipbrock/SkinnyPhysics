project:
  type: book
  output-dir: docs
  resources:
    - "mechanics/motion/examples/_output/*.html"
    - "mechanics/motion/examples/_output/*_files/"
    - "mechanics/motion/examples/_output/*.png"
    - "mechanics/momentum/examples/_output/*.html"
    - "mechanics/momentum/examples/_output/*_files/"
    - "mechanics/momentum/examples/_output/*.png"

book:
  title: "Skinny Physics for QS&BB"
  author: "Chip Brock"
  date: "2025-09-12"
  search:
    location: sidebar
    type: textbox
  navbar:
    right:
      - icon: arrow-up-right-circle-fill
        href: https://qsandbb.org
        aria-label: QS&BB
        text: QS&BB
  sidebar:
    search: true
    logo: images/logo_orange_words.png
  chapters:
    - index.qmd
    - part: mechanics/index.qmd
      chapters:
        - mechanics/motion/motion_3.qmd
        - mechanics/momentum/momentum.qmd
        - mechanics/collisions/collisions.qmd
        - mechanics/energy/energy.qmd
    - part: gravitation/index.qmd
      chapters:
        - gravitation/Cosmology_early/ancient_cosmology_1.qmd
        - gravitation/Cosmology_early/Copernicus_cosmology_1.qmd
        - gravitation/Cosmology_early/Tycho_Kepler_cosmology_1.qmd
        - gravitation/gravitation_placeholder/grav_placeholder.qmd
    - part: electromagnetism/index.qmd
      chapters:
        - electromagnetism/electromagnetism_placeholder/em_placeholder.qmd
    - part: relativity/index.qmd
      chapters:
        - relativity/relativity_placeholder/SR_placeholder.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, brand, custom.scss]
    html-math-method: mathjax
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            tags: 'ams',
            tagSide: 'right',
            packages: {'[+]': ['ams']}
          },
          chtml: { scale: 0.9 }
        };
        </script>

editor: visual
