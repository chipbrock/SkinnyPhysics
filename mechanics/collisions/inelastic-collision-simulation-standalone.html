<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Inelastic Collision Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fafafa;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
        }
        .slider-container {
            margin: 8px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 2px;
            font-weight: 500;
            color: #333;
            font-size: 13px;
        }
        input[type="range"] {
            width: 100%;
            height: 2px;
            border-radius: 1px;
            background: #999;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            border: none;
            margin-top: -7px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            border: none;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #999;
            border-radius: 1px;
        }
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 2px;
            background: #999;
            border-radius: 1px;
        }
        input[type="range"]::-moz-range-progress {
            background: #999;
            height: 2px;
            border-radius: 1px;
        }
        input[type="range"]::-ms-track {
            width: 100%;
            height: 2px;
            background: transparent;
            border-color: transparent;
            color: transparent;
        }
        input[type="range"]::-ms-fill-lower {
            background: #999;
            border-radius: 1px;
        }
        input[type="range"]::-ms-fill-upper {
            background: #999;
            border-radius: 1px;
        }
        input[type="range"]::-ms-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
            border: none;
        }
        .value-display {
            display: inline-block;
            min-width: 40px;
            text-align: right;
            font-weight: bold;
            color: #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        button:hover {
            background: #45a049;
        }
        button:active {
            transform: scale(0.98);
        }
        .bottom-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-top: 10px;
        }
        .button-container {
            flex-shrink: 0;
        }
        .physics-container {
            flex-grow: 1;
            display: flex;
            gap: 20px;
            font-size: 11px;
            font-family: Helvetica, Arial, sans-serif;
        }
        .blue-text {
            color: #4563a7;
        }
        .red-text {
            color: #ff6600;
        }
        .purple-text {
            color: #9C27B0;
        }
        #simulation {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="slider-container">
                <label>Velocity 1 (→): <span class="value-display" id="vel1-display">5.0</span></label>
                <input type="range" id="velocity1" min="0" max="10" step="0.5" value="5">
            </div>
            <div class="slider-container">
                <label>Velocity 2 (←): <span class="value-display" id="vel2-display">5.0</span></label>
                <input type="range" id="velocity2" min="0" max="10" step="0.5" value="5">
            </div>
            <div class="slider-container">
                <label>Mass 1: <span class="value-display" id="mass1-display">10</span></label>
                <input type="range" id="mass1" min="1" max="19" step="1" value="10">
            </div>
            <div class="slider-container">
                <label>Mass 2: <span class="value-display" id="mass2-display">10</span></label>
                <input type="range" id="mass2" min="1" max="19" step="1" value="10">
            </div>
        </div>
        <div id="simulation"></div>
        <div class="bottom-row">
            <div class="button-container">
                <button id="runButton">Run</button>
                <button id="stopButton" style="margin-top: 5px; background: #d32f2f;">Stop</button>
            </div>
            <div class="physics-container">
                <div id="physics-initial"></div>
                <div id="physics-final"></div>
            </div>
        </div>
    </div>

    <script>
        // Update displays when sliders change
        document.getElementById('velocity1').addEventListener('input', function(e) {
            document.getElementById('vel1-display').textContent = parseFloat(e.target.value).toFixed(1);
        });
        document.getElementById('velocity2').addEventListener('input', function(e) {
            document.getElementById('vel2-display').textContent = parseFloat(e.target.value).toFixed(1);
        });
        document.getElementById('mass1').addEventListener('input', function(e) {
            document.getElementById('mass1-display').textContent = e.target.value;
        });
        document.getElementById('mass2').addEventListener('input', function(e) {
            document.getElementById('mass2-display').textContent = e.target.value;
        });

        // Set up SVG
        const width = 750;
        const height = 200;
        const svg = d3.select('#simulation')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // Define arrowheads
        svg.append('defs').selectAll('marker')
            .data(['arrowblue', 'arrowred', 'arrowpurple'])
            .enter().append('marker')
            .attr('id', d => d)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 8)
            .attr('refY', 0)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', d => d === 'arrowblue' ? '#4563a7' : d === 'arrowred' ? '#ff6600' : '#9C27B0');

        // Create objects
        const obj1 = svg.append('circle')
            .attr('r', 20)
            .attr('fill', '#4563a7')
            .attr('cx', 100)
            .attr('cy', height/2);

        const obj2 = svg.append('circle')
            .attr('r', 20)
            .attr('fill', '#ff6600')
            .attr('cx', 650)
            .attr('cy', height/2);

        // Create velocity arrows
        const arrow1 = svg.append('line')
            .attr('stroke', '#4563a7')
            .attr('stroke-width', 3)
            .attr('marker-end', 'url(#arrowblue)')
            .attr('y1', height/2)
            .attr('y2', height/2);

        const arrow2 = svg.append('line')
            .attr('stroke', '#ff6600')
            .attr('stroke-width', 3)
            .attr('marker-end', 'url(#arrowred)')
            .attr('y1', height/2)
            .attr('y2', height/2);

        // Create labels
        const label1 = svg.append('text')
            .attr('y', height/2)
            .attr('dy', 6)
            .attr('text-anchor', 'middle')
            .attr('fill', 'white')
            .attr('font-size', '14px')
            .attr('font-weight', 'bold')
            .text('1');

        const label2 = svg.append('text')
            .attr('y', height/2)
            .attr('dy', 6)
            .attr('text-anchor', 'middle')
            .attr('fill', 'white')
            .attr('font-size', '14px')
            .attr('font-weight', 'bold')
            .text('2');

        // Create velocity text above objects
        const vel1Text = svg.append('text')
            .attr('y', height/2 - 30)
            .attr('text-anchor', 'middle')
            .attr('fill', '#4563a7')
            .attr('font-size', '12px')
            .attr('font-weight', 'bold');

        const vel2Text = svg.append('text')
            .attr('y', height/2 - 30)
            .attr('text-anchor', 'middle')
            .attr('fill', '#ff6600')
            .attr('font-size', '12px')
            .attr('font-weight', 'bold');

        const physicsInitialDiv = d3.select('#physics-initial');
        const physicsFinalDiv = d3.select('#physics-final');

        let isRunning = false;

        document.getElementById('runButton').addEventListener('click', function() {
            if (!isRunning) {
                isRunning = true;
                runSimulation();
            }
        });

        document.getElementById('stopButton').addEventListener('click', function() {
            isRunning = false;
            
            // Stop all transitions
            svg.selectAll('*').interrupt();
            
            // Reset to initial positions
            const mass1 = parseInt(document.getElementById('mass1').value);
            const mass2 = parseInt(document.getElementById('mass2').value);
            const velocity1 = parseFloat(document.getElementById('velocity1').value);
            const velocity2 = parseFloat(document.getElementById('velocity2').value);
            
            const radius1 = Math.sqrt(mass1) * 5;
            const radius2 = Math.sqrt(mass2) * 5;
            
            obj1.attr('r', radius1).attr('cx', 100).attr('cy', height/2);
            obj2.attr('r', radius2).attr('cx', 650).attr('cy', height/2);
            
            label1.attr('x', 100);
            label2.attr('x', 650);
            
            vel1Text.attr('x', 100).text(`v=${velocity1.toFixed(1)}`);
            vel2Text.attr('x', 650).text(`v=${velocity2.toFixed(1)}`);
            
            const v1_initial = velocity1;
            const v2_initial = -velocity2;
            
            arrow1.attr('x1', 100 + radius1)
                .attr('x2', 100 + radius1 + v1_initial * 10)
                .attr('marker-end', 'url(#arrowblue)')
                .attr('visibility', v1_initial !== 0 ? 'visible' : 'hidden');
                
            arrow2.attr('x1', 650 - radius2)
                .attr('x2', 650 - radius2 + v2_initial * 10)
                .attr('marker-end', 'url(#arrowred)')
                .attr('visibility', v2_initial !== 0 ? 'visible' : 'hidden');
            
            physicsInitialDiv.html('');
            physicsFinalDiv.html('');
        });

        function runSimulation() {
            const mass1 = parseInt(document.getElementById('mass1').value);
            const mass2 = parseInt(document.getElementById('mass2').value);
            const velocity1 = parseFloat(document.getElementById('velocity1').value);
            const velocity2 = parseFloat(document.getElementById('velocity2').value);
            
            const radius1 = Math.sqrt(mass1) * 5;
            const radius2 = Math.sqrt(mass2) * 5;
            
            // Reset sizes
            obj1.attr('r', radius1);
            obj2.attr('r', radius2);
            
            // Initial velocities (velocity2 is leftward, so negative)
            const v1_initial = velocity1;
            const v2_initial = -velocity2;
            
            // Calculate final velocity for totally inelastic collision
            const v_final = (mass1 * v1_initial + mass2 * v2_initial) / (mass1 + mass2);
            
            // Calculate momentum and kinetic energy
            const p1_initial = mass1 * v1_initial;
            const p2_initial = mass2 * v2_initial;
            const p_total_initial = p1_initial + p2_initial;
            
            const ke1_initial = 0.5 * mass1 * v1_initial * v1_initial;
            const ke2_initial = 0.5 * mass2 * v2_initial * v2_initial;
            const ke_total_initial = ke1_initial + ke2_initial;
            
            const p_final = (mass1 + mass2) * v_final;
            const ke_final = 0.5 * (mass1 + mass2) * v_final * v_final;
            
            // Display initial conditions with LaTeX
            const initialInfo = [
                '<strong style="color: darkgreen;">INITIAL:</strong>',
                `<span class="blue-text">Blue: \\(m=${mass1}\\), \\(v=${v1_initial.toFixed(1)}\\) → \\(p=${p1_initial.toFixed(2)}\\), \\(KE=${ke1_initial.toFixed(2)}\\)</span>`,
                `<span class="red-text">Red: \\(m=${mass2}\\), \\(v=${v2_initial.toFixed(1)}\\) → \\(p=${p2_initial.toFixed(2)}\\), \\(KE=${ke2_initial.toFixed(2)}\\)</span>`,
                `<strong style="color: darkgreen;">Total: \\(p=${p_total_initial.toFixed(2)}\\), \\(KE=${ke_total_initial.toFixed(2)}\\)</strong>`
            ];
            
            physicsInitialDiv.html(initialInfo.join('<br>'));
            MathJax.typesetPromise([document.getElementById('physics-initial')]);
            
            // Reset positions
            const start1 = 100;
            const start2 = 650;
            
            obj1.attr('cx', start1);
            obj2.attr('cx', start2);
            label1.attr('x', start1);
            label2.attr('x', start2);
            vel1Text.attr('x', start1).text(`v=${v1_initial.toFixed(1)}`);
            vel2Text.attr('x', start2).text(`v=${v2_initial.toFixed(1)}`);
            
            // Set up initial arrows
            arrow1.attr('x1', start1 + radius1)
                .attr('x2', start1 + radius1 + v1_initial * 10)
                .attr('y1', height/2)
                .attr('y2', height/2)
                .attr('marker-end', 'url(#arrowblue)')
                .attr('stroke', '#4563a7')
                .attr('stroke-width', 3)
                .attr('visibility', v1_initial !== 0 ? 'visible' : 'hidden');
                
            arrow2.attr('x1', start2 - radius2)
                .attr('x2', start2 - radius2 + v2_initial * 10)
                .attr('y1', height/2)
                .attr('y2', height/2)
                .attr('marker-end', 'url(#arrowred)')
                .attr('stroke', '#ff6600')
                .attr('stroke-width', 3)
                .attr('visibility', v2_initial !== 0 ? 'visible' : 'hidden');
            
            // Calculate collision point and timing
            const totalDistance = start2 - start1 - radius1 - radius2;
            let collisionPos1, collisionPos2, timeToCollision;
            
            if (velocity1 === 0 && velocity2 === 0) {
                // Both stationary - no collision
                return;
            } else if (velocity1 === 0) {
                // Object 1 is stationary, object 2 moves to it
                collisionPos1 = start1;
                collisionPos2 = start1 + radius1 + radius2;
                const distance2 = start2 - collisionPos2;
                timeToCollision = (distance2 / velocity2) * 100;
            } else if (velocity2 === 0) {
                // Object 2 is stationary, object 1 moves to it
                collisionPos2 = start2;
                collisionPos1 = start2 - radius1 - radius2;
                const distance1 = collisionPos1 - start1;
                timeToCollision = (distance1 / v1_initial) * 100;
            } else {
                // Both moving - calculate meeting point for CENTERS
                const velocitySum = v1_initial + velocity2;
                const distanceRatio1 = v1_initial / velocitySum;
                const meetingPointCenter = start1 + totalDistance * distanceRatio1;
                
                // Ball centers should be (radius1 + radius2) apart at collision
                collisionPos1 = meetingPointCenter - radius2;
                collisionPos2 = meetingPointCenter + radius1;
                
                const distance1 = collisionPos1 - start1;
                const distance2 = start2 - collisionPos2;
                
                const timeToCollision1 = (distance1 / v1_initial) * 100;
                const timeToCollision2 = (distance2 / velocity2) * 100;
                timeToCollision = (timeToCollision1 + timeToCollision2) / 2;
            }
            
            // After collision, both objects move together
            const postDistance = 200;
            const postDuration = v_final === 0 ? 1000 : Math.abs((postDistance / v_final) * 100);
            
            // Calculate the center point where the combined mass will be
            const combinedCenter = (mass1 * collisionPos1 + mass2 * collisionPos2) / (mass1 + mass2);
            
            // Animate objects to collision point
            obj1.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('cx', collisionPos1)
                .on('end', function() {
                    // After collision, both move together
                    if (v_final !== 0) {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('cx', combinedCenter + (v_final > 0 ? postDistance : -postDistance));
                    } else {
                        // Move to combined center if stopped
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(300)
                            .attr('cx', combinedCenter);
                    }
                });
            
            obj2.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('cx', collisionPos2)
                .on('end', function() {
                    if (v_final !== 0) {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('cx', combinedCenter + (v_final > 0 ? postDistance : -postDistance));
                    } else {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(300)
                            .attr('cx', combinedCenter);
                    }
                });
            
            // Animate arrows to collision
            arrow1.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x1', v1_initial === 0 ? collisionPos1 : collisionPos1 + radius1)
                .attr('x2', v1_initial === 0 ? collisionPos1 : collisionPos1 + radius1 + v1_initial * 10)
                .on('end', function() {
                    // Hide individual arrows and show combined arrow
                    d3.select(this).attr('visibility', 'hidden');
                    
                    // Create combined velocity arrow
                    const combinedArrow = svg.append('line')
                        .attr('stroke', '#9C27B0')
                        .attr('stroke-width', 3)
                        .attr('marker-end', v_final !== 0 ? 'url(#arrowpurple)' : 'none')
                        .attr('y1', height/2)
                        .attr('y2', height/2)
                        .attr('x1', v_final === 0 ? combinedCenter : combinedCenter + (v_final > 0 ? radius1 : -radius1))
                        .attr('x2', v_final === 0 ? combinedCenter : combinedCenter + (v_final > 0 ? radius1 : -radius1) + v_final * 10)
                        .attr('visibility', 'visible');
                    
                    if (v_final !== 0) {
                        combinedArrow.transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('x1', combinedCenter + (v_final > 0 ? postDistance + radius1 : -postDistance - radius1))
                            .attr('x2', combinedCenter + (v_final > 0 ? postDistance + radius1 : -postDistance - radius1) + v_final * 10);
                    }
                });
            
            arrow2.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x1', v2_initial === 0 ? collisionPos2 : collisionPos2 - radius2)
                .attr('x2', v2_initial === 0 ? collisionPos2 : collisionPos2 - radius2 + v2_initial * 10)
                .on('end', function() {
                    d3.select(this).attr('visibility', 'hidden');
                    
                    setTimeout(() => {
                        // Display final conditions in HTML div with LaTeX
                        const finalInfo = [
                            '<strong style="color: darkgreen;">FINAL:</strong>',
                            `<span class="purple-text">Combined: \\(m=${mass1 + mass2}\\), \\(v=${v_final.toFixed(1)}\\) → \\(p=${p_final.toFixed(2)}\\), \\(KE=${ke_final.toFixed(2)}\\)</span>`,
                            `<strong style="color: darkgreen;">Total: \\(p=${p_final.toFixed(2)}\\), \\(KE=${ke_final.toFixed(2)}\\)</strong>`,
                            `<strong style="color: #d32f2f;">Energy lost: \\(\\Delta KE=${(ke_total_initial - ke_final).toFixed(2)}\\)</strong>`
                        ];
                        
                        physicsFinalDiv.html(finalInfo.join('<br>'));
                        MathJax.typesetPromise([document.getElementById('physics-final')]);
                    }, 200);
                });
            
            // Animate labels
            label1.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x', collisionPos1)
                .on('end', function() {
                    if (v_final !== 0) {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('x', combinedCenter + (v_final > 0 ? postDistance : -postDistance));
                    } else {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(300)
                            .attr('x', combinedCenter);
                    }
                });
            
            label2.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x', collisionPos2)
                .on('end', function() {
                    if (v_final !== 0) {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('x', combinedCenter + (v_final > 0 ? postDistance : -postDistance));
                    } else {
                        d3.select(this).transition()
                            .ease(d3.easeLinear)
                            .duration(300)
                            .attr('x', combinedCenter);
                    }
                });
            
            // Animate velocity text
            vel1Text.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x', collisionPos1)
                .on('end', function() {
                    d3.select(this).attr('visibility', 'hidden');
                });
            
            vel2Text.transition()
                .ease(d3.easeLinear)
                .duration(timeToCollision)
                .attr('x', collisionPos2)
                .on('end', function() {
                    d3.select(this).attr('visibility', 'hidden');
                    
                    // Create combined velocity text
                    const combinedVelText = svg.append('text')
                        .attr('x', combinedCenter)
                        .attr('y', height/2 - 30)
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#9C27B0')
                        .attr('font-size', '12px')
                        .attr('font-weight', 'bold')
                        .text(`v=${v_final.toFixed(1)}`);
                    
                    if (v_final !== 0) {
                        combinedVelText.transition()
                            .ease(d3.easeLinear)
                            .duration(postDuration)
                            .attr('x', combinedCenter + (v_final > 0 ? postDistance : -postDistance));
                    }
                });
        }
    </script>
</body>
</html>
